name: Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Cargo.lock changes
        id: lockfile
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [ -z "$base_sha" ] || ! git cat-file -e "$base_sha" 2>/dev/null; then
            # No usable base commit (e.g. first push of a new branch) — run the
            # audit rather than silently skip it.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base_sha" "${{ github.sha }}" | grep -qx "Cargo.lock"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # cargo-audit is run directly rather than via rustsec/audit-check, which
      # publishes through the Checks API and therefore needs `checks: write`.
      # Fork PRs cap GITHUB_TOKEN at read-only regardless of any `permissions:`
      # block, so that action would 403 on the first outside contribution that
      # touches Cargo.lock.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.lockfile.outputs.changed == 'true'

      - name: Install cargo-audit
        if: steps.lockfile.outputs.changed == 'true'
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        if: steps.lockfile.outputs.changed == 'true'
        run: cargo audit --deny warnings
